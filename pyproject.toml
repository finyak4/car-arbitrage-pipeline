[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 1. PROJECT METADATA
[project]
name = "toyota-market-ml"
version = "0.1.0"
description = "End-to-end web scraping, MLOps, and price prediction pipeline for Toyota vehicles"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Vladyslav Finiak", email = "vlad.finyak4201@gmail.com" }
]

# Core production dependencies
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "playwright>=1.41.0",
    "playwright-stealth>=1.0.6",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "catboost>=1.2.0",
    "lightgbm>=4.0.0",
    "mlflow>=2.10.0",
    "pydantic-settings>=2.0.0",
    "tqdm>=4.66.0",
    "joblib>=1.3.0",
    "streamlit>=1.35.0"
]

# Development & Quality Assurance tools
[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "bandit>=1.7.7",
    "pip-audit>=2.7.0",
    "pre-commit>=3.6.0",
    "optuna>=3.5.0"
]

# 2. CLI ENTRY POINT (Makes your commands globally accessible)
[project.scripts]
toyota-ml = "src.cli:app"

# 3. HATCHLING BUILD CONFIGURATION
[tool.hatch.build.targets.wheel]
packages = ["src"]

# 4. TOOL CONFIGURATIONS
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # Pyflakes/pycodestyle errors
    "F",   # Pyflakes logic errors
    "I",   # isort (automatic import sorting)
    "UP",  # pyupgrade (modern Python syntax)
    "B",   # flake8-bugbear (common bug catches)
]
ignore = ["E501"]  # Line length handled by formatter

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]